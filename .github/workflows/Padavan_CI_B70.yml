# GitHub Actions 自动编译 Padavan (极路由 B70 / HC5962)
#
# 核心思路:
#   上游 hanwckf/rt-n56u 官方 CI 用 ubuntu-20.04, 但该 runner image 在 2025-04-15 已被
#   GitHub Actions EOL 移除。装回 20.04 工具链/库的最简单方法:
#     用 ubuntu-latest runner + ubuntu:20.04 container image, 这样 host GCC 是新的
#     但 step 内 apt/gcc 都是 20.04 = libc6-dev 含 rpc/rpc.h, dropbear conftest 通过
#   另一个要点: dropbear 的交叉编译 conftest 探测 host zlib 会失败,
#               在 Makefile 里把 --enable-zlib 改为 --disable-zlib
#
# 触发方式:
#   1. 手动: Actions 页 -> Run workflow
#   2. 定时: 每天 UTC 0:00 (北京时间 08:00)
#   3. push: 改 configs/scripts/etc_storage/www/clash-yaml 或本文件都会触发

name: "Padavan CI B70"

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main, master]
    paths:
      - 'configs/**'
      - 'scripts/**'
      - 'etc_storage/**'
      - 'clash-yaml/**'
      - 'www/**'
      - '.github/workflows/**'

jobs:
  build:
    name: "B70 @ ubuntu-20.04 (container)"
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # 关键: 用 container image 锁定 Ubuntu 20.04, 绕过 GitHub Actions runner EOL
    container:
      image: ubuntu:20.04

    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4

      - name: Setup base system (ubuntu 20.04 container)
        run: |
          # 容器默认 root, 不需 sudo
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates locales sudo
          locale-gen en_US.UTF-8 || true
          update-ca-certificates || true

      - name: Install build deps (Padavan + cross-compile essentials)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y --no-install-recommends \
            unzip libtool-bin curl cmake gperf gawk flex bison \
            cpio git python3-docutils gettext automake autopoint texinfo \
            build-essential help2man pkg-config zlib1g-dev libgmp3-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libltdl-dev wget libc-dev-bin bc fakeroot kmod \
            file rsync ncurses-dev
          echo "=== git version ==="
          git --version
          echo "=== gcc version ==="
          gcc --version | head -1

      - name: Clone Padavan upstream source
        run: |
          if [ ! -d "padavan-4.4" ]; then
            git clone --depth 1 https://github.com/hanwckf/rt-n56u.git padavan-4.4
          fi
          cd padavan-4.4
          git submodule update --init --recursive || true
          git log -1 --oneline

      - name: Drop in B70.config
        run: |
          mkdir -p padavan-4.4/trunk/configs/templates
          cp -v "$GITHUB_WORKSPACE/configs/templates/B70.config" \
                padavan-4.4/trunk/configs/templates/B70.config
          head -20 padavan-4.4/trunk/configs/templates/B70.config

      - name: Drop in post-build scripts
        run: |
          mkdir -p padavan-4.4/trunk/scripts
          cp -rT "$GITHUB_WORKSPACE/scripts" padavan-4.4/trunk/scripts/

      - name: Drop in /etc/storage scripts (router runtime)
        run: |
          mkdir -p padavan-4.4/trunk/scripts/etc_storage
          mkdir -p padavan-4.4/trunk/scripts/etc_storage/www
          cp -rT "$GITHUB_WORKSPACE/etc_storage"        padavan-4.4/trunk/scripts/etc_storage/
          cp -f  "$GITHUB_WORKSPACE/www/dashboard.html" padavan-4.4/trunk/scripts/etc_storage/www/dashboard.html
          find padavan-4.4/trunk/scripts/etc_storage -type f | head -30

      - name: Patch dropbear (host toolchain compat for cross-compile)
        run: |
          set -e
          MF="padavan-4.4/trunk/user/dropbear/Makefile"

          python3 - <<'PYEOF'
          MF = "padavan-4.4/trunk/user/dropbear/Makefile"
          src = open(MF, encoding="utf-8").read()
          orig = src

          # 1) 禁用 zlib: configure 探测 host zlib 在 cross-compile 时不可靠,
          #    关掉只是丢 SSH 压缩, SSH 本身仍能用.
          src = src.replace("--enable-zlib", "--disable-zlib")

          # 2) 禁用 hardened build flags: dropbear configure.ac 第 71 行起会探测并注入
          #    -fPIE / -pie / -Wl,-z,now / -Wl,-z,relro / -fstack-protector-strong /
          #    -D_FORTIFY_SOURCE=2 等. uclibc 工具链 (gcc 7.4 + uclibc) 没有
          #    __stack_chk_guard / __stack_chk_fail 符号, 链接时 ld 报
          #    "undefined reference to `__stack_chk_*'" -> dropbearmulti 链接失败.
          #    --disable-harden 整段跳过硬化标志注入, dropbear 仍可用, 仅失去 PIE/SP 等.
          src = src.replace(
              "--disable-zlib \\",
              "--disable-zlib \\\n\t--disable-harden \\",
          )

          # 3) crypt/basename 用 ac_cv_* 注入 (dropbear configure.ac 第 188-189 行探测):
          #    - AC_CHECK_FUNC(crypt):       ac_cv_func_crypt=yes
          #    - AC_CHECK_LIB(crypt, crypt): ac_cv_search_crypt=-lcrypt
          #    - basename 与 toolchain libgen.h 冲突: ac_cv_func_basename=yes
          #    这样不污染 cross-compile CFLAGS/LIBS, 让 conftest 保持干净.
          #    注入到 autoreconf 之前 (subshell 内 export, 持续到 ./configure 完成).
          old = "autoreconf -v; \\"
          new = ("autoreconf -v; \\\n"
                 "\texport ac_cv_func_crypt=yes "
                 "ac_cv_search_crypt=\"-lcrypt\" "
                 "ac_cv_func_basename=yes; \\")
          if old in src:
              src = src.replace(old, new)
              print("OK: prepended ac_cv_* export before autoreconf")
          else:
              print("FAIL: autoreconf line not matched, configure will fail!")

          if src == orig:
              print("WARN: nothing changed")
          open(MF, "w", encoding="utf-8").write(src)
          print("=== patched relevant ===")
          for ln in src.splitlines():
              if "ac_cv" in ln or "zlib" in ln or "autoreconf" in ln or "./configure" in ln:
                  print("  ", ln)
          PYEOF

          echo "=== patched dropbear Makefile (head) ==="
          sed -n '20,45p' "$MF"

      - name: Download toolchain (mipsel)
        working-directory: padavan-4.4/toolchain-mipsel
        run: |
          chmod +x ./dl_toolchain.sh
          ./dl_toolchain.sh
          ls -d toolchain-* || ls

      - name: Build B70 firmware
        working-directory: padavan-4.4/trunk
        # 关键: 20.04 container 的 /bin/sh 是 dash, 不认 `set -o pipefail`. 必须强制 bash.
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          export TNAME=B70
          fakeroot ./build_firmware_modify "$TNAME" 2>&1 | tee build.log
          if ! ls images/*.trx 1>/dev/null 2>&1; then
            echo "::error::Build produced no .trx!"
            echo "--- LAST 200 LINES OF build.log ---"
            tail -200 build.log
            echo "--- END build.log ---"
            # 关键: 如果 build.log 里出现 dropbear configure 失败, 把 config.log 抓出来
            if grep -qE "dropbear.*configure|configure.*cannot create executables" build.log; then
              echo "--- DROPBEAR CONFIG.LOG (last 80 lines) ---"
              find . -path '*/user/dropbear/*config.log' -exec tail -80 {} \; 2>/dev/null || echo "(no config.log found)"
              echo "--- END DROPBEAR CONFIG.LOG ---"
            fi
            exit 1
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-b70-${{ github.run_id }}
          path: padavan-4.4/trunk/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run post-build (bundle storage files)
        working-directory: padavan-4.4/trunk
        run: |
          bash ../scripts/post_build.sh B70 || bash scripts/post_build.sh B70 || true

      - name: List output
        working-directory: padavan-4.4/trunk/images
        run: |
          ls -lah
          echo "---"
          du -h *.trx

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: B70-firmware-${{ github.run_id }}
          path: |
            padavan-4.4/trunk/images/*.trx
            padavan-4.4/trunk/scripts/etc_storage/**
          if-no-files-found: warn
          retention-days: 30

      - name: Publish Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: padavan-b70-${{ github.run_id }}
          name: "Padavan B70 build ${{ github.run_id }}"
          body: |
            Auto-built Padavan firmware for 极路由 B70 (HC5962, MT7621).
            🛠 Built with [Padavan CI B70](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            • Includes: ShellClash + Tailscale + aria2 + Dashboard
            • See repo README for installation notes
          files: |
            padavan-4.4/trunk/images/*.trx
